<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বরিশাল ক্যাডেট কলেজ</title>
<link rel="icon" type="image/png" href="icon/bcc.png">
<style>
:root{color-scheme:light;--primary:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e8edf5;--field-border:#cfd8e6;--field-bg:#fff;--option-bg:#fff;--secondary-bg:#e8eef8;--secondary-text:#172033;--progress-bg:#e6ebf3;--photo-bg:#f8fafc;--shadow:0 4px 18px #0000000d}
body[data-theme="dark"]{color-scheme:dark;--primary:#60a5fa;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#a7b4c8;--border:#334155;--field-border:#475569;--field-bg:#0f172a;--option-bg:#1e293b;--secondary-bg:#334155;--secondary-text:#e2e8f0;--progress-bg:#334155;--photo-bg:#0f172a;--shadow:0 4px 18px #00000040}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);transition:background-color .2s,color .2s}
.container{max-width:1000px;margin:auto;padding:22px}
header{background:var(--card);border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.header-brand{display:flex;align-items:center;gap:16px;min-width:0}
.header-brand > div{min-width:0;max-width:100%}
.header-controls{display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;gap:4px;width:68px;height:68px;flex-shrink:0}
.header-controls .secondary{min-width:0;width:100%;height:32px;padding:4px;font-size:12px}
.school-logo{width:68px;height:68px;object-fit:contain;flex-shrink:0}
h1{margin:0 0 8px;font-size:clamp(16px,5vw,28px);line-height:1.3;overflow-wrap:anywhere;text-wrap:balance}
body.cadet-details-page .header-top{justify-content:center;position:relative}
body.cadet-details-page .header-brand{justify-content:center;text-align:center;width:100%;padding:0 64px}
body.cadet-details-page .header-brand > div{text-align:center}
body.cadet-details-page .header-controls{position:absolute;right:0;top:50%;transform:translateY(-50%)}
body.cadet-details-page .header-brand .school-link{position:absolute;left:0}
body.cadet-details-page .header-brand .school-logo{display:block}
body.cadet-details-page .section-indicator{text-align:center}
body.evaluation-choice-page .header-top{justify-content:center;position:relative}
body.evaluation-choice-page .header-brand{justify-content:center;text-align:center}
body.evaluation-choice-page .header-brand > div{text-align:center}
body.evaluation-choice-page .header-controls{position:absolute;right:0;top:50%;transform:translateY(-50%)}
body.evaluation-choice-page .header-brand .school-link{position:absolute;left:0}
body.evaluation-choice-page .header-brand .school-logo{display:block}
body.evaluation-choice-page .section-indicator{text-align:center}
body.college-evaluation-page .header-top{justify-content:center;position:relative}
body.college-evaluation-page .header-brand{justify-content:center;text-align:center;width:100%;padding:0 64px}
body.college-evaluation-page .header-brand > div{text-align:center}
body.college-evaluation-page .header-controls{position:absolute;right:0;top:50%;transform:translateY(-50%)}
body.college-evaluation-page .header-brand .school-link{position:absolute;left:0}
body.college-evaluation-page .header-brand .school-logo{display:block}
body.college-evaluation-page #assessmentForm .section.active > .section-title{text-align:center}
body.college-evaluation-page .section-indicator{text-align:center}
.subtitle{color:var(--muted)}
.section{background:var(--card);border-radius:16px;padding:22px;margin:18px 0;box-shadow:var(--shadow)}
.section-header{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--border);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
.section-person{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.person-photo{width:72px;height:72px;object-fit:cover;border-radius:50%;border:2px solid var(--border);background:var(--photo-bg)}
.person-meta{display:flex;flex-direction:column;gap:4px}
.section-title{font-size:20px;font-weight:700}
.cadet-details-reminder{color:#dc2626}
#assessmentForm .section.active:first-child > .section-title{text-align:center}
body.evaluation-choice-page #assessmentForm .section.active > .section-title{text-align:center}
.person-name{font-size:16px;color:var(--muted);font-weight:600}
.student-details{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 20px}
.class-field{flex:1 1 240px}
.class-field label{display:block;font-weight:700;margin-bottom:8px}
.class-field select{width:100%;border:1px solid var(--field-border);border-radius:10px;padding:11px 12px;background:var(--field-bg);color:var(--text);font:inherit}
.class-field input{width:100%;border:1px solid var(--field-border);border-radius:10px;padding:11px 12px;background:var(--field-bg);color:var(--text);font:inherit}
.question{padding:16px 0;border-bottom:1px solid var(--border)}
.question:last-child{border-bottom:0}
.qtext{font-weight:600;margin-bottom:12px}
.options{display:flex;gap:10px;flex-wrap:wrap}
.option{border:1px solid var(--field-border);border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--option-bg)}
.option:hover{border-color:var(--primary)}
.option input{margin-right:7px}
.evaluation-options{display:grid;grid-template-columns:repeat(2,minmax(0,200px));justify-content:center;gap:12px}
.evaluation-choice{width:100%;min-height:44px;border:1px solid var(--field-border);border-radius:14px;background:var(--option-bg);color:var(--text);font:inherit;font-size:17px;font-weight:700;padding:8px;box-shadow:var(--shadow)}
.evaluation-choice:hover{border-color:var(--primary);transform:translateY(-2px)}
.college-answer{width:100%;min-height:120px;border:1px solid var(--field-border);border-radius:10px;padding:12px;background:var(--field-bg);color:var(--text);font:inherit;resize:vertical}
.comment-wrap{display:none;margin-top:12px}
.comment-wrap.show{display:block}
.comment{width:100%;min-height:75px;border:1px solid var(--field-border);border-radius:10px;padding:10px;resize:vertical;background:var(--field-bg);color:var(--text);font:inherit}
.actions{position:sticky;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center;border-top:1px solid var(--border)}
.actions[hidden]{display:none}
.actions-credit{color:var(--muted);font-size:13px;text-align:center}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
.primary{background:var(--primary);color:white}
.secondary{background:var(--secondary-bg);color:var(--secondary-text)}
.theme-toggle{flex-shrink:0;width:100%;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.thank-you{background:var(--card);border-radius:16px;padding:48px 24px;margin:18px 0;text-align:center;box-shadow:var(--shadow)}
.thank-you-icon{font-size:48px;color:var(--primary);margin-bottom:12px}
.thank-you h2{margin:0 0 10px}
.thank-you p{color:var(--muted);margin:0}
.thank-you .other-evaluation-button{margin-top:24px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.section { display:none; }
.section.active { display:block; }
.navigation { display:flex; justify-content:space-between; gap:12px; margin:18px 0 80px; }
.navigation button { min-width:120px; }
.navigation .next { margin-left:auto; }
.section-indicator { font-weight:700; margin-top:8px; color:#2563eb; }
@media(max-width:600px){.container{padding:12px}.section{padding:16px}.header-top{align-items:center}.header-brand{gap:10px}.header-controls{align-items:stretch;width:52px;height:52px}.header-controls .secondary{height:24px;padding:2px;font-size:10px}.theme-toggle{height:24px;font-size:14px}.school-logo{width:52px;height:52px}.actions-credit{font-size:11px}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="header-top">
    <div class="header-brand">
      <a class="school-link" href="https://infinityar-ict.github.io/ParentsFeedback/" target="_blank" rel="noopener noreferrer" aria-label="মূল্যায়ন ফর্ম ওয়েবসাইট দেখুন">
        <img class="school-logo" src="icon/bcc.png" alt="বরিশাল ক্যাডেট কলেজের লোগো">
      </a>
      <div>
        <h1 id="formTitle">বরিশাল ক্যাডেট কলেজ</h1>
      </div>
    </div>
    <div class="header-controls">
      <button type="button" id="themeToggle" class="secondary theme-toggle" aria-label="ডার্ক মোড চালু করুন" title="ডার্ক মোড চালু করুন" aria-pressed="false" onclick="toggleTheme()">
        <span id="themeIcon" aria-hidden="true">🌙</span>
      </button>
      <button type="button" id="languageToggle" class="secondary" aria-label="Switch to English" title="Switch to English" onclick="toggleLanguage()">English</button>
    </div>
  </div>
</header>

<div id="assessmentContent">
<form id="assessmentForm"></form>

<div class="navigation">
  <button type="button" class="secondary" id="prevBtn" onclick="previousSection()">পূর্ববর্তী</button>
  <button type="button" class="primary next" id="nextBtn" onclick="nextSection()">পরবর্তী</button>
</div>

<div class="actions">
  <button type="button" class="secondary" onclick="clearForm()">ফর্ম পরিষ্কার করুন</button>
  <span class="actions-credit">@আইসিটি বিভাগ, বরিশাল ক্যাডেট কলেজ</span>
</div>
<div id="saveStatus" class="note" role="status" aria-live="polite" style="text-align:center"></div>
</div>

<section id="thankYouPage" class="thank-you" aria-labelledby="thankYouHeading" hidden>
  <div class="thank-you-icon" aria-hidden="true">✓</div>
  <h2 id="thankYouHeading" tabindex="-1">ধন্যবাদ!</h2>
  <p id="thankYouMessage">আপনার মূল্যায়ন পাঠানো হয়েছে। মূল্যায়ন সম্পন্ন করার জন্য ধন্যবাদ।</p>
  <button type="button" id="otherEvaluationButton" class="primary other-evaluation-button" onclick="startOtherEvaluation()">আরেকটি উত্তর শুরু করুন</button>
</section>
</div>

  en: {
    pageTitle: "Barishal Cadet College",
    classLabel: "Class",
    houseLabel: "House",
    formLabel: "Form",
    cadetName: "Cadet name",
    cadetNumber: "Cadet number",
    warning: "Parents and guardians are encouraged to provide the cadet's number and name, but it is not mandatory.",
    missionPrompt: "2. Is Barishal Cadet College moving toward a specific goal or objective? In one or more sentences, describe the goal or objective as you see it.",
    managementPrompt: "11. Please share your opinion on proper management and improvement of the college environment.",
    placeholder: "You may write in English or Bengali.",
    clearForm: "Clear form",
    previous: "Previous",
    next: "Next",
    submit: "Submit",
    saveStatus: "Sending responses to Google Sheets...",
    saveError: "Google Sheets saving is not configured yet. Follow the steps in README.md.",
    saveFail: "The evaluation could not be saved: ",
    thankYouTitle: "Thank you for completing the Barishal Cadet College evaluation!",
    thankYouMessage: "Your evaluation has been submitted. Thank you for your feedback.",
    otherEvaluationLabel: "Start another response",
    darkEnable: "Enable dark mode",
    darkDisable: "Disable dark mode",
    switchLanguageLabel: "Switch to English",
    switchBackLabel: "Switch to Bangla",
    clearConfirm: "Clear all answers and comments?",
    selectClassAlert: "Please select a class before continuing.",
    selectHouseAlert: "Please select a house before continuing.",
    selectFormAlert: "Please select a form before continuing.",
    cadetNameAlert: "Cadet name may contain only letters and spaces.",
    ratingAlert: "Please select a rating for every question.",
    commentAlert: "Please fill in the comment field.",
    missionAlert: "Please complete the goal/objective comment field.",
    emptyOption: "Select",
    englishToggle: "English",
    banglaToggle: "বাংলা",
    selectClass: "Select class",
    selectHouse: "Select house",
    selectForm: "Select form"
  }
};
const languageState = { current: 'bn' };
let currentSection = 1;
let submissionInProgress = false;

function uiText(){ return TRANSLATIONS[languageState.current]; }

function applyLanguage(nextLanguage){
  languageState.current = nextLanguage;
  document.documentElement.lang = nextLanguage;
  const ui = uiText();
  const formTitle = document.getElementById('formTitle');
  if(formTitle){ formTitle.textContent = ui.pageTitle; }
  document.title = ui.pageTitle;
  const button = document.getElementById('languageToggle');
  if(button){
    const isBangla = languageState.current === 'bn';
    button.textContent = isBangla ? ui.englishToggle : ui.banglaToggle;
    button.setAttribute('aria-label', isBangla ? ui.switchLanguageLabel : ui.switchBackLabel);
    button.title = isBangla ? ui.switchLanguageLabel : ui.switchBackLabel;
  }
}

function buildForm(){
  const form = document.getElementById('assessmentForm');
  if(!form){ return; }
  const ui = uiText();
  const options = OPTION_LABELS[languageState.current];
  const questions = QUESTION_TEXTS[languageState.current];
  const classOptions = SELECT_OPTION_TEXT.classNames[languageState.current].map(entry => {
    return `<option value="${entry.value}">${entry.label}</option>`;
  }).join('');
  const houseOptions = SELECT_OPTION_TEXT.houseNames[languageState.current].map(entry => (
    `<option value="${entry.value}">${entry.label}</option>`
  )).join('');
  const formOptions = SELECT_OPTION_TEXT.formNames[languageState.current].map(entry => {
    return `<option value="${entry.value}">${entry.label}</option>`;
  }).join('');
  let html = `<section class="section">
    <div class="section-title cadet-details-reminder">${ui.warning}</div>
    <div class="student-details">
      <div class="class-field">
        <label for="className">${ui.classLabel} <span aria-hidden="true">*</span></label>
        <select id="className" name="className" required>
          ${classOptions}
        </select>
      </div>
      <div class="class-field">
        <label for="houseName">${ui.houseLabel} <span aria-hidden="true">*</span></label>
        <select id="houseName" name="houseName" required>
          ${houseOptions}
        </select>
      </div>
      <div class="class-field">
        <label for="formName">${ui.formLabel} <span aria-hidden="true">*</span></label>
        <select id="formName" name="formName" required>
          ${formOptions}
        </select>
      </div>
      <div class="class-field">
        <label for="cadetName">${ui.cadetName}</label>
        <input id="cadetName" name="cadetName" type="text" maxlength="200" autocomplete="name" title="${languageState.current === 'bn' ? 'শুধু বর্ণ ও ফাঁকা জায়গা ব্যবহার করুন।' : 'Use letters and spaces only.'}">
      </div>
      <div class="class-field">
        <label for="cadetNumber">${ui.cadetNumber}</label>
        <input id="cadetNumber" name="cadetNumber" type="text" maxlength="100" inputmode="numeric" pattern="[0-9]*" title="${languageState.current === 'bn' ? 'শুধু সংখ্যা লিখুন।' : 'Enter digits only.'}">
      </div>
    </div>
  </section>`;
  html += `<section class="section">`;
  questions.forEach(question => {
    html += `<div class="question"><div class="qtext">${question.text}</div><div class="options">`;
    options.forEach(option => {
      html += `<label class="option"><input type="radio" name="college-${question.key}" value="${option}" required onchange="toggleCollegeComment('${question.key}', this.value)"> ${OPTION_EMOJIS[languageState.current][option]} ${option}</label>`;
    });
    html += `</div><div id="college-${question.key}-comment-wrap" class="comment-wrap"><textarea id="college-${question.key}-comment" class="comment" placeholder="${ui.placeholder}"></textarea></div></div>`;
    if(question.key === 'environmentRating'){
      html += `<div class="question"><label class="qtext" for="collegeMissionDescription">${ui.missionPrompt}</label><textarea id="collegeMissionDescription" class="college-answer" maxlength="5000" placeholder="${ui.placeholder}" required></textarea></div>`;
    }
  });
  html += `<div class="question"><label class="qtext" for="collegeManagementComment">${ui.managementPrompt}</label><textarea id="collegeManagementComment" class="college-answer" maxlength="5000" placeholder="${ui.placeholder}"></textarea></div>`;
  html += `</section>`;
  form.innerHTML = html;
  document.getElementById('cadetName').addEventListener('input', event => {
    event.target.value = event.target.value.replace(/[^\p{L}\p{M}\s]/gu, '').replace(/\s+/g, ' ');
  });
  document.getElementById('cadetNumber').addEventListener('input', event => {
    event.target.value = event.target.value.replace(/\D/g, '');
  });
  showSection(1);
}

function toggleCollegeComment(key, selectedValue){
  const commentWrap = document.getElementById(`college-${key}-comment-wrap`);
  const commentField = document.getElementById(`college-${key}-comment`);
  const isBangla = languageState.current === 'bn';
  const showComment = selectedValue === (isBangla ? 'গড়পরতা' : 'Average')
    || selectedValue === (isBangla ? 'গড়পরতার নিচে' : 'Below average')
    || selectedValue === (isBangla ? 'সন্তোষজনক নয়' : 'Unsatisfactory');
  commentWrap.classList.toggle('show', showComment);
  commentField.required = showComment;
  if(!showComment){ commentField.value = ''; }
}

function setSaveStatus(message, isError = false){
  const status = document.getElementById('saveStatus');
  status.textContent = message;
  status.style.color = isError ? '#b91c1c' : '';
}

async function saveToGoogleSheet(){
  const ui = uiText();
  if(submissionInProgress) return;
  const webAppUrl = 'https://script.google.com/macros/s/AKfycbyhqSK9FQO5jswdDEzPWALfyenoHbrs0frTvj7pXrvnNRSw0F54EqZVLXCmFO9ZnMXljg/exec';
  if(webAppUrl === 'YOUR_APPS_SCRIPT_WEB_APP_URL' || webAppUrl === 'YOUR_COLLEGE_APPS_SCRIPT_WEB_APP_URL'){
    setSaveStatus(ui.saveError, true);
    return;
  }
  submissionInProgress = true;
  setSaveStatus(ui.saveStatus);
  try {
    const submission = {
      evaluationType: 'college',
      className: document.getElementById('className').value,
      houseName: document.getElementById('houseName').value,
      formName: document.getElementById('formName').value,
      cadetName: document.getElementById('cadetName').value.trim(),
      cadetNumber: document.getElementById('cadetNumber').value.trim(),
      collegeAnswers: {
        ratings: Object.fromEntries(QUESTION_TEXTS[languageState.current].map(question => [
          question.key,
          OPTION_VALUES[languageState.current][document.querySelector(`input[name="college-${question.key}"]:checked`)?.value] || ''
        ])),
        comments: Object.fromEntries(QUESTION_TEXTS[languageState.current].map(question => [
          question.key,
          document.getElementById(`college-${question.key}-comment`).value.trim()
        ])),
        missionDescription: document.getElementById('collegeMissionDescription').value.trim(),
        managementComment: document.getElementById('collegeManagementComment').value.trim()
      }
    };
    const response = await fetch(webAppUrl, {
      method: 'POST',
      mode: 'cors',
      headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
      body: new URLSearchParams({payload: JSON.stringify(submission)}).toString()
    });
    const result = await response.json();
    if(!response.ok || result.ok !== true){ throw new Error(result.error || 'The server did not accept the submission.'); }
    showThankYouPage();
  } catch (error) {
    setSaveStatus(`${ui.saveFail}${error.message}`, true);
  } finally {
    submissionInProgress = false;
  }
}

function showThankYouPage(){
  document.getElementById('assessmentContent').hidden = true;
  const ui = uiText();
  document.getElementById('thankYouHeading').textContent = ui.thankYouTitle;
  document.getElementById('thankYouMessage').textContent = ui.thankYouMessage;
  document.getElementById('otherEvaluationButton').textContent = ui.otherEvaluationLabel;
  document.getElementById('thankYouPage').hidden = false;
  document.getElementById('thankYouHeading').focus();
  window.scrollTo({top:0, behavior:'smooth'});
}

function startOtherEvaluation(){
  document.querySelectorAll('#assessmentForm input[type="radio"]').forEach(input => input.checked = false);
  document.querySelectorAll('#assessmentForm textarea').forEach(textarea => textarea.value = '');
  document.querySelectorAll('.comment-wrap').forEach(commentWrap => commentWrap.classList.remove('show'));
  document.getElementById('saveStatus').textContent = '';
  document.getElementById('thankYouPage').hidden = true;
  document.getElementById('assessmentContent').hidden = false;
  buildForm();
}

function showSection(sectionNumber){
  currentSection = sectionNumber;
  document.body.classList.toggle('cadet-details-page', currentSection === 1);
  document.body.classList.toggle('college-evaluation-page', currentSection === 2);
  const ui = uiText();
  document.getElementById('formTitle').textContent = ui.pageTitle;
  document.title = ui.pageTitle;
  document.querySelectorAll('.section').forEach((section, index) => section.classList.toggle('active', index + 1 === currentSection));
  const prevBtn = document.getElementById('prevBtn');
  prevBtn.hidden = currentSection === 1;
  prevBtn.disabled = currentSection === 1;
  prevBtn.textContent = ui.previous;
  document.querySelector('.actions').hidden = currentSection === 1;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.hidden = false;
  if(currentSection === 2){
    nextBtn.textContent = ui.submit;
    nextBtn.onclick = finishAssessment;
  } else {
    nextBtn.textContent = ui.next;
    nextBtn.onclick = nextSection;
  }
  document.querySelector('.actions .secondary').textContent = ui.clearForm;
  window.scrollTo({top:0, behavior:'smooth'});
}

function currentSectionComplete(){
  const ui = uiText();
  if(currentSection === 1){
    const classField = document.getElementById('className');
    if(!classField.value){ alert(ui.selectClassAlert); classField.focus(); return false; }
    const houseField = document.getElementById('houseName');
    if(!houseField.value){ alert(ui.selectHouseAlert); houseField.focus(); return false; }
    const formField = document.getElementById('formName');
    if(!formField.value){ alert(ui.selectFormAlert); formField.focus(); return false; }
    const cadetName = document.getElementById('cadetName');
    if(cadetName.value.trim() && !/^[\p{L}\p{M}]+(?:\s+[\p{L}\p{M}]+)*$/u.test(cadetName.value.trim())){ alert(ui.cadetNameAlert); cadetName.focus(); return false; }
    return true;
  }
  if(currentSection !== 2) return false;
  for(const question of QUESTION_TEXTS[languageState.current]){
    const rating = document.querySelector(`input[name="college-${question.key}"]:checked`);
    if(!rating){ alert(ui.ratingAlert); document.querySelector(`input[name="college-${question.key}"]`).focus(); return false; }
    const commentField = document.getElementById(`college-${question.key}-comment`);
    if(commentField.required && !commentField.value.trim()){ alert(ui.commentAlert); commentField.focus(); return false; }
  }
  const missionDescription = document.getElementById('collegeMissionDescription');
  if(!missionDescription.value.trim()){ alert(ui.missionAlert); missionDescription.focus(); return false; }
  return true;
}

function nextSection(){ if(!currentSectionComplete()) return; if(currentSection === 1) showSection(2); }
function previousSection(){ if(currentSection > 1) showSection(currentSection - 1); }
function finishAssessment(){ if(!currentSectionComplete()) return; saveToGoogleSheet(); }
function clearForm(){
  if(!confirm(uiText().clearConfirm)) return;
  document.getElementById('assessmentForm').reset();
  document.querySelectorAll('.comment-wrap').forEach(x => x.classList.remove('show'));
  buildForm();
}

function applyTheme(theme){
  const isDark = theme === 'dark';
  document.body.dataset.theme = isDark ? 'dark' : 'light';
  const toggle = document.getElementById('themeToggle');
  const label = isDark ? uiText().darkDisable : uiText().darkEnable;
  toggle.setAttribute('aria-label', label);
  toggle.title = label;
  document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
  toggle.setAttribute('aria-pressed', String(isDark));
}

function toggleTheme(){
  const nextTheme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(nextTheme);
  try { localStorage.setItem('assessmentTheme', nextTheme); } catch (error) {}
}

function initializeTheme(){
  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem('assessmentTheme') || 'light'; } catch (error) {}
  applyTheme(savedTheme);
}

function toggleLanguage(){
  const nextLanguage = languageState.current === 'bn' ? 'en' : 'bn';
  applyLanguage(nextLanguage);
  buildForm();
}

initializeTheme();
applyLanguage('bn');
buildForm();
</script>
</body>
</html>
